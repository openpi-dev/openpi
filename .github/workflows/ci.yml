name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/*/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          for lockfile in extensions/*/package-lock.json; do
            npm ci --prefix "$(dirname "$lockfile")"
          done
      - run: npm run format:check
      - run: npm run check
      - run: npm test
