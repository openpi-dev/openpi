name: Feishu PR Notification

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    name: Notify Feishu
    uses: openpi-dev/automation/.github/workflows/openpi-feishu-pr-notification.yml@ac8a4140e4ce458a2ed693c5ec9798946ccc0dda # main
    secrets:
      FEISHU_PR_BOT_WEBHOOK: ${{ secrets.FEISHU_PR_BOT_WEBHOOK }}
      FEISHU_PR_BOT_SECRET: ${{ secrets.FEISHU_PR_BOT_SECRET }}
