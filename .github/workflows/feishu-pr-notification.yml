name: Feishu PR Notification

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    name: Notify Feishu
    uses: openpi-dev/automation/.github/workflows/openpi-feishu-pr-notification.yml@f11b483efea42336d14d74841e84e85881bfc68f
    secrets:
      FEISHU_PR_BOT_WEBHOOK: ${{ secrets.FEISHU_PR_BOT_WEBHOOK }}
      FEISHU_PR_BOT_SECRET: ${{ secrets.FEISHU_PR_BOT_SECRET }}
